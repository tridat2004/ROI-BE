version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: roi_calculation
    restart: always

    environment:
      POSTGRES_DB: roi_calculation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: